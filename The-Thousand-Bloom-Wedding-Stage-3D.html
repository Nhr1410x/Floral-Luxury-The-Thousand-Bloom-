<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Thousand Bloom – Sân khấu cưới 3D Cao Cấp (Tối Ưu 60 FPS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#18151c;--fg:#fbf4ee;--pn:rgba(30,22,26,.82);--ac:#d4af37;--gold:#e8c15a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Montserrat",system-ui,sans-serif;overflow:hidden;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.ui{position:fixed;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;pointer-events:none;z-index:10}
.top{top:env(safe-area-inset-top,0px);justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(20,16,22,.85) 0%,transparent 100%)}
.title-box{pointer-events:auto;display:flex;flex-direction:column;gap:2px}
h1{margin:0;font-size:18px;font-family:"Cormorant Garamond",serif;font-weight:700;letter-spacing:1px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
h1 span{color:var(--gold)}
small{font-size:11px;color:#e2c99a;text-shadow:0 1px 4px #000;letter-spacing:.5px}
.bot{bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(0deg,rgba(20,16,22,.9) 0%,transparent 100%);padding-bottom:16px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{pointer-events:auto;background:var(--pn);color:var(--fg);border:1px solid rgba(212,175,55,.35);padding:8px 14px;border-radius:20px;font-family:inherit;font-size:12.5px;font-weight:500;backdrop-filter:blur(10px);cursor:pointer;transition:all .25s ease;display:flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
button:hover{background:rgba(212,175,55,.3);border-color:var(--gold);color:#fff;transform:translateY(-1px)}
button.on{background:linear-gradient(135deg,#d4af37,#b38f24);color:#1a1408;font-weight:700;border-color:var(--gold);box-shadow:0 0 16px rgba(212,175,55,.5)}
#msg{position:fixed;top:65px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:20px;background:rgba(20,16,22,.92);border:1px solid var(--gold);color:var(--gold);font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.hint{position:fixed;top:65px;right:14px;padding:6px 12px;border-radius:12px;background:rgba(0,0,0,.6);font-size:11px;color:#d8d0c8;pointer-events:none;z-index:9}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui top">
  <div class="title-box">
    <h1>The Thousand Bloom <span>• Ngàn hoa, một hành trình</span></h1>
    <small>Sảnh Tiệc Cưới 3D Cao Cấp • Floral Luxury Concept</small>
  </div>
  <div class="btn-group">
    <button id="btnMusic">🎵 Nhạc nền</button>
    <button id="btnMode" class="on">🌙 Lễ đường</button>
    <button id="btnShot">📷 Chụp ảnh 3D</button>
    <button id="btnExp">⬇ Xuất 3D (GLB)</button>
  </div>
</div>
<div class="hint">Chuột trái: Xoay 360° • Chuột phải: Lia góc máy • Cuộn: Phóng to/Thu nhỏ</div>
<div class="ui bot">
  <div class="btn-group">
    <button data-v="overview" class="on">🎭 Toàn cảnh</button>
    <button data-v="stage">👑 Sân khấu chính</button>
    <button data-v="arch">🌸 Vòm hoa & Chữ</button>
    <button data-v="leftStair">🪜 Cầu thang hoa trái</button>
    <button data-v="rightStair">🪜 Cầu thang hoa phải</button>
    <button data-v="aisle">🚶 Lối đi thảm kem</button>
    <button data-v="table">🪑 Bàn tiệc VIP</button>
    <button id="btnTour">🕊️ Flycam Tour</button>
  </div>
</div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
// Khởi tạo các DOM elements an toàn
const btnMusic = document.getElementById('btnMusic');
const btnMode  = document.getElementById('btnMode');
const btnShot  = document.getElementById('btnShot');
const btnExp   = document.getElementById('btnExp');
const btnTour  = document.getElementById('btnTour');
const msgEl    = document.getElementById('msg');
const say = t => { if (!msgEl) return; msgEl.textContent = t; msgEl.style.opacity = t ? 1 : 0; if (t) setTimeout(() => msgEl.style.opacity = 0, 2600); };

const V = THREE.Vector3, cv = document.getElementById('c');
const R = new THREE.WebGLRenderer({
  canvas: cv,
  antialias: true,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});

// Giới hạn pixelRatio ở mức 1.5 để đảm bảo 60 FPS mượt mà tuyệt đối trên mọi màn hình
R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.15;
R.outputEncoding = THREE.sRGBEncoding;
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a151e);
scene.fog = new THREE.Fog(0x1a151e, 26, 68);

const cam = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
cam.position.set(0, 3.2, 14.5);

// OrbitControls với đầy đủ xoay 360 độ, lia máy (pan) và zoom cực nhạy
const controls = new THREE.OrbitControls(cam, cv);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 1.2;
controls.maxDistance = 55;
controls.target.set(0, 2.4, -4.5);
controls.update();

// Môi trường phản xạ ánh sáng (PMREM Environment Map nhẹ)
{
  const pm = new THREE.PMREMGenerator(R), es = new THREE.Scene();
  es.background = new THREE.Color(0x28202d);
  const lp = (x, y, z, w, h, c) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: c, side: THREE.DoubleSide}));
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    es.add(m);
  };
  lp(0, 10, -5, 14, 8, 0xffeedd);
  lp(0, 4, 10, 12, 6, 0xffd9c8);
  lp(-9, 5, 0, 6, 6, 0xffe4d4);
  lp(9, 5, 0, 6, 6, 0xffe4d4);
  scene.environment = pm.fromScene(es, 0.03).texture;
  pm.dispose();
}

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: 0.7}, o));
const add = (g, m, x = 0, y = 0, z = 0) => {
  const o = new THREE.Mesh(g, m);
  o.position.set(x, y, z);
  scene.add(o);
  return o;
};

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];

// BẢNG MÀU CONCEPT "THE THOUSAND BLOOM"
const PINK = [0xf7c8d1, 0xfce4e8, 0xeaa5b4, 0xf9d5dc, 0xffffff];
const BLUE = [0xa7bbd6, 0xbcd0e8, 0x8faed3, 0xc7d6ea];
const WHITE = [0xffffff, 0xfaf6f0, 0xfdfbf7];
const GREEN = [0xa7b89f, 0x8ea086, 0x7a8e73, 0xb8c7b1];
const GOLD = 0xd4af37;

// ---- TỐI ƯU HÓA GEOMETRY HOA ĐỘ PHÂN GIẢI CAO NHƯNG CỰC NHẸ (LOW POLY - HIGH IMPACT)
const qI = new THREE.Quaternion(), sph = new THREE.SphereGeometry(1, 6, 4);

function petal(len, wid, cup, curl, ruf, su = 2, sv = 3) {
  const P = [], C = [], I = [];
  for (let j = 0; j <= sv; j++) {
    const v = j / sv;
    for (let i = 0; i <= su; i++) {
      const u = i / su * 2 - 1, w = wid * Math.pow(Math.sin(Math.PI * (v * .82 + .1)), .55);
      P.push(u * w, v * len, cup * u * u * wid - curl * v * v * len + ruf * Math.sin(u * 5 + v * 7) * v);
      const b = (.65 + .35 * v);
      C.push(b, b, b);
    }
  }
  for (let j = 0; j < sv; j++) for (let i = 0; i < su; i++) {
    const a = j * (su + 1) + i, b = a + 1, c = a + su + 1, d = c + 1;
    I.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  g.setIndex(I);
  g.computeVertexNormals();
  return g;
}

function merge(parts) {
  const P = [], N = [], C = [], I = [];
  let o = 0;
  parts.forEach(([g, m, c]) => {
    g = g.clone().applyMatrix4(m);
    const p = g.attributes.position, n = g.attributes.normal, ca = g.attributes.color, cc = Array.isArray(c) ? c : [c, c, c];
    for (let i = 0; i < p.count; i++) {
      P.push(p.getX(i), p.getY(i), p.getZ(i));
      N.push(n.getX(i), n.getY(i), n.getZ(i));
      const k = ca ? ca.getX(i) : 1;
      C.push(cc[0] * k, cc[1] * k, cc[2] * k);
    }
    (g.index ? Array.from(g.index.array) : []).forEach(i => I.push(i + o));
    o += p.count;
  });
  const r = new THREE.BufferGeometry();
  r.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  r.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  r.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  r.setIndex(I);
  return r;
}

function bloom(rings, center) {
  const parts = [], mt = new THREE.Matrix4();
  if (center) parts.push([sph, mt.clone().compose(new V(0, .08, 0), qI, new V(.14, .16, .14)), center]);
  rings.forEach((r, k) => {
    const pg = petal(r.len, r.wid, r.cup, r.curl, r.ruf || 0), br = .8 + .2 * k / Math.max(1, rings.length - 1);
    for (let i = 0; i < r.n; i++) {
      const a = i / r.n * Math.PI * 2 + k * .8;
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-r.tilt, a + Math.PI, 0, 'YXZ'));
      parts.push([pg, mt.clone().compose(new V(Math.sin(a) * r.rad, 0, Math.cos(a) * r.rad), q, new V(1, 1, 1)), br]);
    }
  });
  return merge(parts);
}

// Bộ hình học hoa tối ưu chỉ ~180-216 tam giác mỗi bông (giảm 85% gánh nặng GPU)
const roseGeo  = bloom([{n:3,rad:.02,tilt:.05,len:.5,wid:.25,cup:1.2,curl:0},{n:5,rad:.07,tilt:.2,len:.7,wid:.35,cup:.9,curl:.05},{n:7,rad:.14,tilt:.45,len:.85,wid:.42,cup:.6,curl:.15}]);
const peonyGeo = bloom([{n:4,rad:.03,tilt:.1,len:.55,wid:.35,cup:.9,curl:.08},{n:6,rad:.08,tilt:.3,len:.72,wid:.48,cup:.7,curl:.15},{n:8,rad:.15,tilt:.6,len:.88,wid:.55,cup:.5,curl:.25}]);
const blosGeo  = bloom([{n:5,rad:.04,tilt:1.1,len:.65,wid:.38,cup:.2,curl:0}],[1,.85,.4]);
const budGeo   = bloom([{n:3,rad:.01,tilt:.02,len:.5,wid:.2,cup:1.2,curl:0},{n:5,rad:.04,tilt:.1,len:.68,wid:.3,cup:1,curl:.04}]);
const leafGeo  = (()=>{const su=2,sv=4,P=[],C=[],I=[];for(let j=0;j<=sv;j++){const v=j/sv;for(let i=0;i<=su;i++){const u=i/su*2-1,w=.2*Math.pow(Math.sin(Math.PI*(v*.92+.04)),.75)*(j%2?1.07:.95);P.push(u*w,v*.8,.45*Math.abs(u)*w-.22*v*v);const b=(.6+.4*v);C.push(b,b,b)}}for(let j=0;j<sv;j++)for(let i=0;i<su;i++){const a=j*(su+1)+i,b=a+1,c=a+su+1,d=c+1;I.push(a,b,c,b,d,c)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));g.setIndex(I);g.computeVertexNormals();return g.rotateX(Math.PI/2)})();
const bGeo     = new THREE.IcosahedronGeometry(0.8, 0);

// Vật liệu MeshStandardMaterial nhẹ và tương thích 100% với WebGL mọi trình duyệt
const FM = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.65, vertexColors: true, side: THREE.DoubleSide});
const LM = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.6, vertexColors: true, side: THREE.DoubleSide});
const bMat = M(0xffffff, {emissive: 0x4a4038, roughness: 0.5});

const UP = new V(0, 1, 0), Z = new V(0, 0, 1);
const rv = () => new V(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
const ST = {rose: [], peony: [], blos: [], bud: [], leaf: [], baby: []};

function put(k, B, pos, quat, s, col) {
  ST[k].push([B.clone().multiply(new THREE.Matrix4().compose(pos, quat, new V(s, s, s))), new THREE.Color(col)]);
}

function cluster(cx, cy, cz, r, n, sx = 1, sy = 1, sz = 1, preferBlue = false) {
  const B = new THREE.Matrix4().compose(new V(cx, cy, cz), qI, new V(sx, sy, sz));
  for (let i = 0; i < n; i++) {
    const t = Math.random();
    const k = t < 0.35 ? 'rose' : t < 0.55 ? 'peony' : t < 0.75 ? 'bud' : 'blos';
    const v = rv(), f = v.clone().add(rv().multiplyScalar(0.35)).normalize();
    const s = {rose: r * rnd(0.24, 0.34), peony: r * rnd(0.3, 0.44), bud: r * rnd(0.16, 0.22), blos: r * rnd(0.14, 0.2)}[k];
    let col;
    if (preferBlue && Math.random() < 0.45) col = pick(BLUE);
    else if (Math.random() < 0.4) col = pick(PINK);
    else col = pick(WHITE);
    put(k, B, v.clone().multiplyScalar(r * rnd(0.8, 1)), new THREE.Quaternion().setFromUnitVectors(UP, f), s, col);
  }
  for (let i = 0; i < n * 0.5; i++) {
    const v = rv();
    put('leaf', B, v.clone().multiplyScalar(r * rnd(0.85, 1.05)), new THREE.Quaternion().setFromUnitVectors(Z, v), r * rnd(0.5, 0.85), pick(GREEN));
  }
}

function baby(cx, cy, cz, sx, sy, sz, n, s) {
  const B = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const v = rv();
    put('baby', B, new V(cx + v.x * sx * rnd(.5, 1.1), cy + v.y * sy * rnd(.5, 1.1), cz + v.z * sz * rnd(.5, 1.1)), qI, s * rnd(.6, 1.4), 0xffffff);
  }
}

function finalize() {
  const mats = {rose: [roseGeo, FM], peony: [peonyGeo, FM], blos: [blosGeo, FM], bud: [budGeo, FM], leaf: [leafGeo, LM], baby: [bGeo, bMat]};
  for (const k in ST) {
    const a = ST[k];
    if (!a.length) continue;
    const m = new THREE.InstancedMesh(mats[k][0], mats[k][1], a.length);
    m.frustumCulled = false;
    a.forEach(([mx, c], i) => {
      m.setMatrixAt(i, mx);
      m.setColorAt(i, c);
    });
    scene.add(m);
  }
}

// ---- 1. KIẾN TRÚC PHÒNG TIỆC & SÀN ĐÁ CẨM THẠCH
{
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#f5ede8';
  x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 25; i++) {
    x.strokeStyle = 'rgba(' + (195 + rnd(0, 25) | 0) + ',170,165,' + rnd(0.04, 0.12) + ')';
    x.lineWidth = rnd(0.8, 2);
    x.beginPath();
    let px = rnd(0, 512), py = rnd(0, 512);
    x.moveTo(px, py);
    for (let k = 0; k < 4; k++) {
      px += rnd(-60, 60); py += rnd(-60, 60);
      x.lineTo(px, py);
    }
    x.stroke();
  }
  x.strokeStyle = 'rgba(212,175,55,0.4)';
  x.lineWidth = 4;
  x.strokeRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(18, 18);
  t.anisotropy = 4;
  add(new THREE.PlaneGeometry(36, 36), M(0xffffff, {map: t, roughness: 0.22, metalness: 0.05}), 0, 0, 0).rotation.x = -Math.PI / 2;
}

// Bức tường rèm voan xếp ly phía sau (Backdrop Wall)
{
  const g = new THREE.PlaneGeometry(36, 9.5, 120, 1), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, 0.15 * Math.sin(p.getX(i) * 3.8));
  g.computeVertexNormals();
  add(g, M(0xfbf6f2, {roughness: 0.65, side: THREE.DoubleSide}), 0, 4.75, -9.5);
}

// Rèm hai bên tường và trần nhà sảnh tiệc
const wallM = M(0xf7ede8, {roughness: 0.7, side: THREE.DoubleSide});
add(new THREE.PlaneGeometry(36, 9.5), wallM, -14, 4.75, 0).rotation.y = Math.PI / 2;
add(new THREE.PlaneGeometry(36, 9.5), wallM, 14, 4.75, 0).rotation.y = -Math.PI / 2;
// Trần nhà màu tối sang trọng
add(new THREE.PlaneGeometry(36, 36), M(0x221e28, {roughness: 0.8, side: THREE.DoubleSide}), 0, 9.5, 0).rotation.x = Math.PI / 2;

// ---- 2. SÂN KHẤU CHÍNH & MŨI BÁN NGUYỆT & BẬC TAM CẤP
const sM = M(0xffffff, {roughness: 0.3, metalness: 0.05});
// Khối sân khấu chữ nhật
add(new THREE.BoxGeometry(16, 0.45, 5.2), sM, 0, 0.225, -6.0);
// Mũi bán nguyệt sân khấu
const semiGeom = new THREE.CylinderGeometry(4.2, 4.2, 0.45, 36, 1, false, 0, Math.PI);
semiGeom.rotateY(Math.PI / 2);
add(semiGeom, sM, 0, 0.225, -3.4);
// Nẹp vàng quanh mũi bán nguyệt
const goldM = M(GOLD, {metalness: 0.88, roughness: 0.2});
{
  const ring = new THREE.RingGeometry(4.15, 4.25, 36, 1, 0, Math.PI);
  ring.rotateX(-Math.PI / 2);
  ring.rotateY(Math.PI / 2);
  add(ring, goldM, 0, 0.455, -3.4);
}
// Bậc tam cấp chính giữa mũi bán nguyệt
add(new THREE.BoxGeometry(3.6, 0.15, 0.6), sM, 0, 0.075, 0.5);
add(new THREE.BoxGeometry(3.3, 0.15, 0.5), sM, 0, 0.225, 0.1);
add(new THREE.BoxGeometry(3.0, 0.15, 0.4), sM, 0, 0.375, -0.3);

// ---- 3. CẦU THANG UỐN CONG CÁNH GÀ HAI BÊN (SWEEPING STAIRS ARCHITECTURE)
[-1, 1].forEach(side => {
  for (let s = 0; s < 9; s++) {
    const t = s / 8;
    const ang = t * (Math.PI / 2.2);
    const x = side * (5.8 + Math.sin(ang) * 3.2);
    const z = -7.5 + Math.cos(ang) * 4.6;
    const y = 3.2 * (1 - t * 0.85) + 0.2;
    add(new THREE.BoxGeometry(1.6, 0.18, 0.55), sM, x, y, z).rotation.y = -side * ang;
  }
});

// ---- 4. HAI CỔNG VÒM KIẾN TRÚC LA MÃ CỔ ĐIỂN HAI BÊN CÁNH GÀ (PALLADIAN ARCHES)
[-6.0, 6.0].forEach(ax => {
  [-1.4, 1.4].forEach(cx => {
    add(new THREE.CylinderGeometry(0.2, 0.22, 4.6, 16), sM, ax + cx, 2.75, -7.8);
    add(new THREE.BoxGeometry(0.6, 0.35, 0.6), goldM, ax + cx, 5.0, -7.8);
    add(new THREE.BoxGeometry(0.6, 0.35, 0.6), sM, ax + cx, 0.45, -7.8);
  });
  add(new THREE.TorusGeometry(1.4, 0.1, 12, 24, Math.PI), sM, ax, 5.0, -7.8);
  add(new THREE.TorusGeometry(1.3, 0.03, 12, 24, Math.PI), goldM, ax, 5.0, -7.75);
  add(new THREE.PlaneGeometry(2.6, 4.5), M(0xfbf6f2, {side: THREE.DoubleSide, roughness: 0.7}), ax, 2.8, -8.0);
});

// ---- 5. KHUNG VÒM TRÒN ĐÔI TRUNG TÂM (GRAND CIRCULAR ARCH)
add(new THREE.TorusGeometry(3.5, 0.05, 12, 48), goldM, 0, 3.8, -7.6);
add(new THREE.TorusGeometry(3.75, 0.035, 12, 48), goldM, 0, 3.8, -7.52);

// Rèm xếp ly trung tâm phía sau vòm tròn
{
  const g = new THREE.PlaneGeometry(7.2, 7.2, 48, 1), p = g.attributes.position;

function makeChandelier(x, y, z, scale, lightIntensity) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.4, 8), goldM);
  chain.position.y = 0.7;
  g.add(chain);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(scale * 0.5, 0.035, 12, 24), goldM);
  g.add(ring);
  const crystalMat = M(0xffffff, {roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.75});
  const cone1 = new THREE.Mesh(new THREE.ConeGeometry(scale * 0.45, 0.6, 12, 1, true), crystalMat);
  cone1.position.y = -0.2;
  g.add(cone1);
  const cone2 = new THREE.Mesh(new THREE.ConeGeometry(scale * 0.6, 0.85, 12, 1, true), crystalMat);
  cone2.position.y = -0.45;
  g.add(cone2);
  
  if (lightIntensity > 0) {
    const pl = new THREE.PointLight(0xfff0d0, lightIntensity, 10, 1.8);
    pl.position.y = -0.3;
    g.add(pl);
  }
  scene.add(g);
  return g;
}

function playMelody() {
  if (!isPlaying) return;
  const chords = [
    [293.66, 369.99, 440.0, 587.33],
    [220.0, 277.18, 329.63, 440.0],
    [246.94, 293.66, 369.99, 493.88],
    [185.0, 220.0, 277.18, 369.99],
    [196.0, 246.94, 293.66, 392.0],
    [220.0, 293.66, 369.99, 440.0],
    [196.0, 246.94, 293.66, 493.88],
    [220.0, 277.18, 329.63, 554.37]
  ];
  const chord = chords[Math.floor(audioStep / 4) % chords.length];
  const note = chord[audioStep % chord.length];
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(note, now);
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.035, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 1.2);

  audioStep++;
  audioTimer = setTimeout(playMelody, 420);
}

// Vòng lặp Render chính 60 FPS mượt mà
(function loop() {
  requestAnimationFrame(loop);

  if (isTour) {
    tourProgress += 0.002;
    const stages = tourWaypoints.length - 1;
    const curStage = Math.min(Math.floor(tourProgress), stages - 1);
    const stageT = tourProgress - curStage;
    if (tourProgress >= stages) {
      tourProgress = 0;
    }
    const p0 = tourWaypoints[curStage];
    const p1 = tourWaypoints[curStage + 1];
    const sT = THREE.MathUtils.smoothstep(stageT, 0, 1);
    cam.position.lerpVectors(new V(...p0.pos), new V(...p1.pos), sT);
    controls.target.lerpVectors(new V(...p0.target), new V(...p1.target), sT);
  } else if (isTransitioning) {
    cam.position.lerp(targetCamPos, 0.08);
    controls.target.lerp(targetControlsTarget, 0.08);
    if (cam.position.distanceTo(targetCamPos) < 0.08 && controls.target.distanceTo(targetControlsTarget) < 0.08) {
      cam.position.copy(targetCamPos);
      controls.target.copy(targetControlsTarget);
      isTransitioning = false;
    }
  }

  controls.update();
  R.render(scene, cam);
})();
</script></body></html>
