<style>

</style></head><body>
<canvas id="c"></canvas>
<div class="ui top">
  <div class="title-box">
    <h1>The Thousand Bloom <span>• Ngàn hoa, một hành trình</span></h1>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
const V = THREE.Vector3, cv = document.getElementById('c');
const R = new THREE.WebGLRenderer({canvas: cv, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.15;
R.outputEncoding = THREE.sRGBEncoding;
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a151e);
scene.fog = new THREE.Fog(0x1a151e, 26, 68);

const cam = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 3.2, 14.5);

// OrbitControls với đầy đủ xoay, lia máy (pan) và zoom mượt mà
const controls = new THREE.OrbitControls(cam, cv);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 1.2;
controls.maxDistance = 55;
controls.target.set(0, 2.4, -4.5);
controls.update();

// Môi trường phản xạ ánh sáng (PMREM Environment Map)
{
  const pm = new THREE.PMREMGenerator(R), es = new THREE.Scene();
  es.background = new THREE.Color(0x28202d);
  const lp = (x, y, z, w, h, c) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: c, side: THREE.DoubleSide}));
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    es.add(m);
  };
  lp(0, 10, -5, 14, 8, 0xffeedd);
  lp(0, 4, 10, 12, 6, 0xffd9c8);
  lp(-9, 5, 0, 6, 6, 0xffe4d4);
  lp(9, 5, 0, 6, 6, 0xffe4d4);
  scene.environment = pm.fromScene(es, 0.03).texture;
  pm.dispose();
}

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: 0.75}, o));
const add = (g, m, x = 0, y = 0, z = 0) => {
  const o = new THREE.Mesh(g, m);
  o.position.set(x, y, z);
  scene.add(o);
  return o;
};

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];

// BẢNG MÀU CONCEPT "THE THOUSAND BLOOM"
const PINK = [0xf7c8d1, 0xfce4e8, 0xeaa5b4, 0xf9d5dc, 0xffffff];
const BLUE = [0xa7bbd6, 0xbcd0e8, 0x8faed3, 0xc7d6ea];
const WHITE = [0xffffff, 0xfaf6f0, 0xfdfbf7];
const GREEN = [0xa7b89f, 0x8ea086, 0x7a8e73, 0xb8c7b1];
const GOLD = 0xd4af37;

// ---- BỘ GEOMETRY CÁNH HOA TỰ NHIÊN THỰC TẾ (PETAL & BLOOM SHAPERS)
const qI = new THREE.Quaternion(), sph = new THREE.SphereGeometry(1, 8, 6);

function petal(len, wid, cup, curl, ruf, su = 4, sv = 4) {
  const P = [], C = [], I = [];
  for (let j = 0; j <= sv; j++) {
    const v = j / sv;
    for (let i = 0; i <= su; i++) {
      const u = i / su * 2 - 1, w = wid * Math.pow(Math.sin(Math.PI * (v * .82 + .1)), .55);
      P.push(u * w, v * len, cup * u * u * wid - curl * v * v * len + ruf * Math.sin(u * 5 + v * 7) * v);
      const b = (.65 + .35 * v) * (1 + .12 * Math.max(0, (v - .8) / .2) * (.5 + .5 * Math.abs(u)));
      C.push(b, b, b);
    }
  }
  for (let j = 0; j < sv; j++) for (let i = 0; i < su; i++) {
    const a = j * (su + 1) + i, b = a + 1, c = a + su + 1, d = c + 1;
    I.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  g.setIndex(I);
  g.computeVertexNormals();
  return g;
}

function merge(parts) {
  const P = [], N = [], C = [], I = [];
  let o = 0;
  parts.forEach(([g, m, c]) => {
    g = g.clone().applyMatrix4(m);
    const p = g.attributes.position, n = g.attributes.normal, ca = g.attributes.color, cc = Array.isArray(c) ? c : [c, c, c];
    for (let i = 0; i < p.count; i++) {
      P.push(p.getX(i), p.getY(i), p.getZ(i));
      N.push(n.getX(i), n.getY(i), n.getZ(i));
      const k = ca ? ca.getX(i) : 1;
      C.push(cc[0] * k, cc[1] * k, cc[2] * k);
    }
    (g.index ? Array.from(g.index.array) : []).forEach(i => I.push(i + o));
    o += p.count;
  });
  const r = new THREE.BufferGeometry();
  r.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  r.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  r.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  r.setIndex(I);
  return r;
}

function bloom(rings, center) {
  const parts = [], mt = new THREE.Matrix4();
  if (center) parts.push([sph, mt.clone().compose(new V(0, .08, 0), qI, new V(.14, .16, .14)), center]);
  rings.forEach((r, k) => {
    const pg = petal(r.len, r.wid, r.cup, r.curl, r.ruf || 0), br = .8 + .2 * k / Math.max(1, rings.length - 1);
    for (let i = 0; i < r.n; i++) {
      const a = i / r.n * Math.PI * 2 + k * .8 + rnd(-.15, .15);
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-(r.tilt + rnd(-.08, .08)), a + Math.PI, 0, 'YXZ'));
      parts.push([pg, mt.clone().compose(new V(Math.sin(a) * r.rad, 0, Math.cos(a) * r.rad), q, new V(rnd(.9, 1.1), rnd(.9, 1.1), 1)), br * rnd(.93, 1.06)]);
    }
  });
  return merge(parts);
}

const roseGeo = bloom([{n:3,rad:.02,tilt:.02,len:.42,wid:.2,cup:1.2,curl:0},{n:5,rad:.06,tilt:.1,len:.58,wid:.3,cup:1,curl:.05},{n:7,rad:.11,tilt:.3,len:.75,wid:.38,cup:.8,curl:.1},{n:9,rad:.17,tilt:.55,len:.88,wid:.44,cup:.6,curl:.2,ruf:.03},{n:11,rad:.23,tilt:.85,len:.95,wid:.5,cup:.5,curl:.3,ruf:.05}]);
const peonyGeo = bloom([{n:6,rad:.04,tilt:.1,len:.6,wid:.45,cup:.8,curl:.1,ruf:.05},{n:8,rad:.09,tilt:.3,len:.75,wid:.5,cup:.7,curl:.15,ruf:.07},{n:10,rad:.15,tilt:.55,len:.88,wid:.56,cup:.6,curl:.2,ruf:.08},{n:12,rad:.22,tilt:.8,len:.97,wid:.6,cup:.5,curl:.3,ruf:.09},{n:14,rad:.3,tilt:1.05,len:1,wid:.62,cup:.4,curl:.35,ruf:.1}]);
const blosGeo = bloom([{n:5,rad:.05,tilt:1.25,len:.7,wid:.42,cup:.2,curl:0}],[1,.82,.35]);
const budGeo = bloom([{n:3,rad:.01,tilt:.02,len:.55,wid:.2,cup:1.3,curl:0},{n:5,rad:.04,tilt:.08,len:.7,wid:.3,cup:1.1,curl:.02},{n:5,rad:.07,tilt:.2,len:.8,wid:.34,cup:1,curl:.08}]);
const leafGeo = (()=>{const su=4,sv=8,P=[],C=[],I=[];for(let j=0;j<=sv;j++){const v=j/sv;for(let i=0;i<=su;i++){const u=i/su*2-1,w=.2*Math.pow(Math.sin(Math.PI*(v*.92+.04)),.75)*(j%2?1.07:.95);P.push(u*w,v*.8,.45*Math.abs(u)*w-.22*v*v);const b=(.6+.4*v)*(Math.abs(u)<.01?1.25:1);C.push(b,b,b)}}
 for(let j=0;j<sv;j++)for(let i=0;i<su;i++){const a=j*(su+1)+i,b=a+1,c=a+su+1,d=c+1;I.push(a,b,c,b,d,c)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));g.setIndex(I);g.computeVertexNormals();return g.rotateX(Math.PI/2)})();
const bGeo = new THREE.IcosahedronGeometry(1, 0);
const bMat = M(0xffffff, {emissive: 0x5a5048, roughness: 0.6});

const FM = new THREE.MeshPhysicalMaterial({color: 0xffffff, roughness: 0.5, vertexColors: true, side: THREE.DoubleSide, emissive: 0x1f1012, sheen: new THREE.Color(0xffc9d2), envMapIntensity: 0.9});
const LM = M(0xffffff, {roughness: 0.45, vertexColors: true, side: THREE.DoubleSide, envMapIntensity: 1.1});

const UP = new V(0, 1, 0), Z = new V(0, 0, 1);
const rv = () => new V(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
const ST = {rose: [], peony: [], blos: [], bud: [], leaf: [], baby: []};

function put(k, B, pos, quat, s, col) {
  ST[k].push([B.clone().multiply(new THREE.Matrix4().compose(pos, quat, new V(s, s, s))), new THREE.Color(col)]);
}

function cluster(cx, cy, cz, r, n, sx = 1, sy = 1, sz = 1, preferBlue = false) {
  const B = new THREE.Matrix4().compose(new V(cx, cy, cz), qI, new V(sx, sy, sz));
  for (let i = 0; i < n; i++) {
    const t = Math.random();
    const k = t < 0.35 ? 'rose' : t < 0.55 ? 'peony' : t < 0.75 ? 'bud' : 'blos';
    const v = rv(), f = v.clone().add(rv().multiplyScalar(0.35)).normalize();
    const s = {rose: r * rnd(0.24, 0.34), peony: r * rnd(0.3, 0.44), bud: r * rnd(0.16, 0.22), blos: r * rnd(0.14, 0.2)}[k];
    let col;
    if (preferBlue && Math.random() < 0.45) col = pick(BLUE);
    else if (Math.random() < 0.4) col = pick(PINK);
    else col = pick(WHITE);
    put(k, B, v.clone().multiplyScalar(r * rnd(0.8, 1)), new THREE.Quaternion().setFromUnitVectors(UP, f), s, col);
  }
  for (let i = 0; i < n * 0.65; i++) {
    const v = rv();
    put('leaf', B, v.clone().multiplyScalar(r * rnd(0.85, 1.05)), new THREE.Quaternion().setFromUnitVectors(Z, v), r * rnd(0.5, 0.85), pick(GREEN));
  }
}

function baby(cx, cy, cz, sx, sy, sz, n, s) {
  const B = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const v = rv();
    put('baby', B, new V(cx + v.x * sx * rnd(.5, 1.1), cy + v.y * sy * rnd(.5, 1.1), cz + v.z * sz * rnd(.5, 1.1)), qI, s * rnd(.6, 1.4), 0xffffff);
  }
}

function finalize() {
  const mats = {rose: [roseGeo, FM], peony: [peonyGeo, FM], blos: [blosGeo, FM], bud: [budGeo, FM], leaf: [leafGeo, LM], baby: [bGeo, bMat]};
  for (const k in ST) {
    const a = ST[k];
    if (!a.length) continue;
    const m = new THREE.InstancedMesh(mats[k][0], mats[k][1], a.length);
    m.frustumCulled = false;
    a.forEach(([mx, c], i) => {
      m.setMatrixAt(i, mx);
      m.setColorAt(i, c);
    });
    scene.add(m);
  }
}

// ---- 1. KIẾN TRÚC PHÒNG TIỆC & SÀN ĐÁ CẨM THẠCH
{
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#f5ede8';
  x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 35; i++) {
    x.strokeStyle = 'rgba(' + (195 + rnd(0, 25) | 0) + ',170,165,' + rnd(0.04, 0.12) + ')';
    x.lineWidth = rnd(0.8, 2);
    x.beginPath();
    let px = rnd(0, 512), py = rnd(0, 512);
    x.moveTo(px, py);
    for (let k = 0; k < 5; k++) {
      px += rnd(-60, 60); py += rnd(-60, 60);
      x.lineTo(px, py);
    }
    x.stroke();
  }
  x.strokeStyle = 'rgba(212,175,55,0.4)';
  x.lineWidth = 4;
  x.strokeRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(18, 18);
  t.anisotropy = 8;
  add(new THREE.PlaneGeometry(36, 36), M(0xffffff, {map: t, roughness: 0.18, metalness: 0.08, envMapIntensity: 1.3}), 0, 0, 0).rotation.x = -Math.PI / 2;
}

// Bức tường rèm voan xếp ly phía sau (Backdrop Wall)
{
  const g = new THREE.PlaneGeometry(36, 9.5, 220, 1), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, 0.15 * Math.sin(p.getX(i) * 3.8));
  g.computeVertexNormals();
  add(g, M(0xfbf6f2, {emissive: 0x221a1d, roughness: 0.65, side: THREE.DoubleSide}), 0, 4.75, -9.5);
}

// Rèm hai bên tường và trần nhà sảnh tiệc
const wallM = M(0xf7ede8, {emissive: 0x1f181a, roughness: 0.7, side: THREE.DoubleSide});
add(new THREE.PlaneGeometry(36, 9.5), wallM, -14, 4.75, 0).rotation.y = Math.PI / 2;
add(new THREE.PlaneGeometry(36, 9.5), wallM, 14, 4.75, 0).rotation.y = -Math.PI / 2;
// Trần nhà màu tối sang trọng để đèn chùm và fairy lights bừng sáng
add(new THREE.PlaneGeometry(36, 36), M(0x221e28, {roughness: 0.8, side: THREE.DoubleSide}), 0, 9.5, 0).rotation.x = Math.PI / 2;

// ---- 2. SÂN KHẤU CHÍNH & MŨI BÁN NGUYỆT & BẬC TAM CẤP
const sM = M(0xffffff, {roughness: 0.28, metalness: 0.05});
// Khối sân khấu chữ nhật
add(new THREE.BoxGeometry(16, 0.45, 5.2), sM, 0, 0.225, -6.0);
// Mũi bán nguyệt sân khấu
const semiGeom = new THREE.CylinderGeometry(4.2, 4.2, 0.45, 48, 1, false, 0, Math.PI);
semiGeom.rotateY(Math.PI / 2);
add(semiGeom, sM, 0, 0.225, -3.4);
// Nẹp vàng quanh mũi bán nguyệt
const goldM = M(GOLD, {metalness: 0.88, roughness: 0.18});
{
  const ring = new THREE.RingGeometry(4.15, 4.25, 48, 1, 0, Math.PI);
  ring.rotateX(-Math.PI / 2);
  ring.rotateY(Math.PI / 2);
  add(ring, goldM, 0, 0.455, -3.4);
}
// Bậc tam cấp chính giữa mũi bán nguyệt
add(new THREE.BoxGeometry(3.6, 0.15, 0.6), sM, 0, 0.075, 0.5);
add(new THREE.BoxGeometry(3.3, 0.15, 0.5), sM, 0, 0.225, 0.1);
add(new THREE.BoxGeometry(3.0, 0.15, 0.4), sM, 0, 0.375, -0.3);

// ---- 3. CẦU THANG UỐN CONG CÁNH GÀ HAI BÊN (SWEEPING STAIRS ARCHITECTURE)
[-1, 1].forEach(side => {
  for (let s = 0; s < 9; s++) {
    const t = s / 8;
    const ang = t * (Math.PI / 2.2);
    const x = side * (5.8 + Math.sin(ang) * 3.2);
    const z = -7.5 + Math.cos(ang) * 4.6;
    const y = 3.2 * (1 - t * 0.85) + 0.2;
    add(new THREE.BoxGeometry(1.6, 0.18, 0.55), sM, x, y, z).rotation.y = -side * ang;
  }
});

// ---- 4. HAI CỔNG VÒM KIẾN TRÚC LA MÃ CỔ ĐIỂN HAI BÊN CÁNH GÀ (PALLADIAN ARCHES)
[-6.0, 6.0].forEach(ax => {
  // 2 Cột La Mã nâng đỡ
  [-1.4, 1.4].forEach(cx => {
    add(new THREE.CylinderGeometry(0.2, 0.22, 4.6, 24), sM, ax + cx, 2.75, -7.8);
    add(new THREE.BoxGeometry(0.6, 0.35, 0.6), goldM, ax + cx, 5.0, -7.8);
    add(new THREE.BoxGeometry(0.6, 0.35, 0.6), sM, ax + cx, 0.45, -7.8);
  });
  // Vòm bán nguyệt trên đỉnh
  add(new THREE.TorusGeometry(1.4, 0.1, 16, 32, Math.PI), sM, ax, 5.0, -7.8);
  add(new THREE.TorusGeometry(1.3, 0.03, 16, 32, Math.PI), goldM, ax, 5.0, -7.75);
  // Rèm voan buông rủ bên trong vòm
  add(new THREE.PlaneGeometry(2.6, 4.5), M(0xfbf6f2, {side: THREE.DoubleSide, roughness: 0.7}), ax, 2.8, -8.0);
});

// ---- 5. KHUNG VÒM TRÒN ĐÔI TRUNG TÂM (GRAND CIRCULAR ARCH)
add(new THREE.TorusGeometry(3.5, 0.05, 16, 64), goldM, 0, 3.8, -7.6);
add(new THREE.TorusGeometry(3.75, 0.035, 16, 64), goldM, 0, 3.8, -7.52);
// Rèm xếp ly trung tâm phía sau vòm tròn
{
  const g = new THREE.PlaneGeometry(7.2, 7.2, 80, 1), p = g.attributes.position;

function makeChandelier(x, y, z, scale, lightIntensity) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  // Trục treo mạ vàng
  const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.4, 8), goldM);
  chain.position.y = 0.7;
  g.add(chain);
  // Vòng kim loại chính
  const ring = new THREE.Mesh(new THREE.TorusGeometry(scale * 0.5, 0.035, 16, 32), goldM);
  g.add(ring);
  // Tầng pha lê rủ
  const crystalMat = M(0xffffff, {roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.75});
  const cone1 = new THREE.Mesh(new THREE.ConeGeometry(scale * 0.45, 0.6, 16, 1, true), crystalMat);
  cone1.position.y = -0.2;
  g.add(cone1);
  const cone2 = new THREE.Mesh(new THREE.ConeGeometry(scale * 0.6, 0.85, 16, 1, true), crystalMat);
  cone2.position.y = -0.45;
  g.add(cone2);
  // Nguồn sáng ấm tỏa ra
  const pl = new THREE.PointLight(0xfff0d0, lightIntensity, 12, 1.8);
  pl.position.y = -0.3;
  g.add(pl);
  scene.add(g);
  return g;
}

function playMelody() {
  if (!isPlaying) return;
  const chords = [
    [293.66, 369.99, 440.0, 587.33],
    [220.0, 277.18, 329.63, 440.0],
    [246.94, 293.66, 369.99, 493.88],
    [185.0, 220.0, 277.18, 369.99],
    [196.0, 246.94, 293.66, 392.0],
    [220.0, 293.66, 369.99, 440.0],
    [196.0, 246.94, 293.66, 493.88],
    [220.0, 277.18, 329.63, 554.37]
  ];
  const chord = chords[Math.floor(audioStep / 4) % chords.length];
  const note = chord[audioStep % chord.length];
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(note, now);
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.04, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 1.2);

  audioStep++;
  audioTimer = setTimeout(playMelody, 420);
}

// Xuất mô hình GLB/ZIP
btnExp.onclick = async () => {
  btnExp.disabled = true;
  say('Đang xuất mô hình 3D GLB...');
  try {
    const grp = new THREE.Group();
    grp.name = 'The_Thousand_Bloom_Stage';
    scene.traverse(o => {
      if (o.isMesh && !o.material.transparent) grp.add(o.clone());
    });
    const glb = await new Promise((res, rej) => new THREE.GLTFExporter().parse(grp, res, {binary: true}));
    const zip = new JSZip();
    zip.file('the-thousand-bloom-stage.glb', glb);
    zip.file('README.txt', 'The Thousand Bloom Wedding Stage 3D Model.\nMo bang Blender (File > Import > glTF 2.0) hoac 3D Viewer.');
    const blob = await zip.generateAsync({type: 'blob'});
    const a = document.createElement('a');
    a.download = 'The-Thousand-Bloom-3D-Stage.zip';
    a.href = URL.createObjectURL(blob);
    a.click();
    say('Xuất file 3D thành công!');
  } catch (err) {
    console.error(err);
    say('Không thể xuất file 3D');
  }
  btnExp.disabled = false;
};

// Người dùng tương tác chuột -> tự hủy lerp chuyển động
controls.addEventListener('start', () => {
  isTransitioning = false;
  if (isTour) {
    isTour = false;
    btnTour.classList.remove('on');
    btnTour.textContent = '🕊️ Flycam Tour';
  }
});

function resize() {
  R.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// Vòng lặp Render chính 60 FPS
(function loop() {
  requestAnimationFrame(loop);

  if (isTour) {
    tourProgress += 0.002;
    const stages = tourWaypoints.length - 1;
    const curStage = Math.min(Math.floor(tourProgress), stages - 1);
    const stageT = tourProgress - curStage;
    if (tourProgress >= stages) {
      tourProgress = 0;
    }
    const p0 = tourWaypoints[curStage];
    const p1 = tourWaypoints[curStage + 1];
    const sT = THREE.MathUtils.smoothstep(stageT, 0, 1);
    cam.position.lerpVectors(new V(...p0.pos), new V(...p1.pos), sT);
    controls.target.lerpVectors(new V(...p0.target), new V(...p1.target), sT);
  } else if (isTransitioning) {
    cam.position.lerp(targetCamPos, 0.08);
    controls.target.lerp(targetControlsTarget, 0.08);
    if (cam.position.distanceTo(targetCamPos) < 0.08 && controls.target.distanceTo(targetControlsTarget) < 0.08) {
      cam.position.copy(targetCamPos);
      controls.target.copy(targetControlsTarget);
      isTransitioning = false;
    }
  }

  controls.update();
  R.render(scene, cam);
})();
